<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&amp;family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      @layer base {
        html,
        body {
          width: 100vw;
          margin: 0;
          padding: 0;
          background-color: #f9f9ff;
        }
        body {
          overscroll-behavior: none;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="js/tailwind-cdn.js"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1a146b",
              "surface-container-high": "#e1e8fd",
              "on-background": "#141b2b",
              "on-tertiary-fixed-variant": "#653e00",
              "secondary-fixed-dim": "#4edea3",
              "secondary-container": "#6cf8bb",
              "tertiary-container": "#543300",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed-variant": "#3e3c8f",
              "surface-variant": "#dce2f7",
              "on-error-container": "#93000a",
              "on-secondary-fixed-variant": "#005236",
              "on-primary": "#ffffff",
              "inverse-on-surface": "#edf0ff",
              "primary-fixed-dim": "#c3c0ff",
              "on-primary-container": "#9c9af4",
              "on-secondary-container": "#00714d",
              "outline-variant": "#c8c5d3",
              "on-tertiary-fixed": "#2a1700",
              "on-primary-fixed": "#100563",
              "inverse-primary": "#c3c0ff",
              "primary-container": "#312e81",
              "on-secondary": "#ffffff",
              "on-secondary-fixed": "#002113",
              "surface-bright": "#f9f9ff",
              surface: "#f9f9ff",
              outline: "#777682",
              error: "#ba1a1a",
              background: "#f9f9ff",
              "on-tertiary": "#ffffff",
              "surface-container-highest": "#dce2f7",
              tertiary: "#372000",
              secondary: "#006c49",
              "secondary-fixed": "#6ffbbe",
              "error-container": "#ffdad6",
              "surface-container-low": "#f1f3ff",
              "on-error": "#ffffff",
              "surface-dim": "#d3daef",
              "inverse-surface": "#293040",
              "surface-container": "#e9edff",
              "on-surface-variant": "#474651",
              "on-surface": "#141b2b",
              "surface-tint": "#5654a8",
              "tertiary-fixed-dim": "#ffb95f",
              "tertiary-fixed": "#ffddb8",
              "primary-fixed": "#e2dfff",
              "on-tertiary-container": "#e49200",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              "gutter-desktop": "1.5rem",
              "container-max": "75rem",
              "space-2xl": "3rem",
              "space-2xs": "0.25rem",
              "space-3xs": "0.125rem",
              "gutter-mobile": "1rem",
              "space-xl": "2rem",
              "space-3xl": "4rem",
              "space-lg": "1.5rem",
              "space-xs": "0.5rem",
              "space-sm": "0.75rem",
              "space-md": "1rem",
            },
            fontFamily: {
              "headline-md": ["DM Sans"],
              "headline-lg": ["DM Sans"],
              "body-sm": ["DM Sans"],
              "headline-xl-mobile": ["DM Sans"],
              "headline-xl": ["DM Sans"],
              "body-md": ["DM Sans"],
              "headline-sm": ["DM Sans"],
              "body-lg": ["DM Sans"],
              "label-sm": ["DM Sans"],
              "headline-lg-mobile": ["DM Sans"],
              "label-md": ["DM Sans"],
            },
            fontSize: {
              "headline-md": [
                "1.75rem",
                {
                  lineHeight: "1.35",
                  letterSpacing: "-0.01em",
                  fontWeight: "500",
                },
              ],
              "headline-lg": [
                "2.5rem",
                {
                  lineHeight: "1.25",
                  letterSpacing: "-0.015em",
                  fontWeight: "500",
                },
              ],
              "body-sm": [
                "0.875rem",
                {
                  lineHeight: "1.65",
                  letterSpacing: "0.01em",
                  fontWeight: "400",
                },
              ],
              "headline-xl-mobile": [
                "2.25rem",
                {
                  lineHeight: "1.25",
                  letterSpacing: "-0.015em",
                  fontWeight: "400",
                },
              ],
              "headline-xl": [
                "3.5rem",
                {
                  lineHeight: "1.2",
                  letterSpacing: "-0.02em",
                  fontWeight: "400",
                },
              ],
              "body-md": [
                "1rem",
                {
                  lineHeight: "1.65",
                  letterSpacing: "0.005em",
                  fontWeight: "400",
                },
              ],
              "headline-sm": [
                "1.25rem",
                { lineHeight: "1.4", fontWeight: "600" },
              ],
              "body-lg": [
                "1.125rem",
                { lineHeight: "1.65", fontWeight: "400" },
              ],
              "label-sm": [
                "0.75rem",
                {
                  lineHeight: "1.4",
                  letterSpacing: "0.03em",
                  fontWeight: "500",
                },
              ],
              "headline-lg-mobile": [
                "1.75rem",
                {
                  lineHeight: "1.3",
                  letterSpacing: "-0.01em",
                  fontWeight: "500",
                },
              ],
              "label-md": [
                "0.875rem",
                {
                  lineHeight: "1.35",
                  letterSpacing: "0.01em",
                  fontWeight: "500",
                },
              ],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen antialiased"
  >
    <header
      class="fixed top-0 inset-x-0 z-50 bg-surface-container-lowest/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"
    >
      <div
        class="h-16 px-gutter-mobile flex items-center justify-between gap-space-sm"
      >
        <div class="flex items-center gap-space-sm min-w-0">
          <div
            class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center flex-shrink-0"
          >
            <span
              class="font-headline-sm text-headline-sm text-on-primary font-bold"
              >V</span
            >
          </div>
          <div class="flex flex-col truncate">
            <span
              class="font-label-md text-label-md text-on-surface tracking-tight truncate"
              >VANTAGE</span
            >
            <span
              class="font-label-sm text-label-sm text-on-surface-variant leading-none truncate"
              >Saved Opportunities</span
            >
          </div>
        </div>
        <div class="flex items-center gap-space-xs flex-shrink-0">
          <button
            aria-label="Search opportunities"
            class="w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors"
          >
            <span class="material-symbols-outlined text-[22px]">search</span>
          </button>
          <div
            class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-sm"
          >
            <span class="material-symbols-outlined text-on-primary text-[18px]"
              >person</span
            >
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 flex flex-col relative w-full pt-16 pb-20 bg-surface">
      <div
        class="flex flex-col w-full max-w-6xl mx-auto px-gutter-mobile gap-space-md"
      >
        <div class="flex items-center justify-between pt-space-xs">
          <div class="flex flex-col">
            <span
              class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-semibold tracking-tight"
              >Saved Opportunities</span
            >
            <span class="font-body-sm text-body-sm text-on-surface-variant"
              >Opportunities you've bookmarked for later</span
            >
          </div>
        </div>

        <div
          id="results-count"
          class="font-body-sm text-body-sm text-on-surface-variant"
        ></div>

        <!-- Main Opportunity Card Stack -->
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-space-md w-full"
          id="opportunityListContainer"
        ></div>

        <!-- Empty State -->
        <div
          class="hidden flex-col items-center justify-center text-center p-space-xl my-space-md bg-surface-container-lowest rounded-2xl shadow-sm"
          id="emptyStateContainer"
        >
          <div
            class="relative w-20 h-20 rounded-full bg-primary/10 flex items-center justify-center mb-space-md"
          >
            <span class="material-symbols-outlined text-[36px] text-primary"
              >bookmark</span
            >
          </div>
          <h3 class="font-headline-sm text-headline-sm text-on-surface">
            No saved opportunities yet
          </h3>
          <p
            class="font-body-sm text-body-sm text-on-surface-variant mt-space-2xs max-w-xs"
          >
            Tap the bookmark icon on any opportunity to save it here for later.
          </p>
          <a
            href="listing.html"
            class="mt-space-lg px-space-lg py-2.5 rounded-lg bg-primary text-on-primary font-label-md text-label-md font-semibold shadow-sm hover:opacity-95 transition-opacity inline-block"
          >
            Browse Opportunities
          </a>
        </div>
      </div>
    </main>

    <nav
      class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container-lowest/80 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]"
      data-active-classes="text-primary font-bold"
    >
      <div class="flex items-center justify-around h-16 px-space-xs">
        <a
          class="flex flex-col items-center justify-center gap-space-3xs min-w-[60px] h-12 text-on-surface-variant hover:text-on-surface transition-colors"
          data-path="home"
          href="index.html"
        >
          <span class="material-symbols-outlined text-[24px]">home</span>
          <span class="font-label-sm text-label-sm tracking-tight">Home</span>
        </a>
        <a
          class="flex flex-col items-center justify-center gap-space-3xs min-w-[60px] h-12 text-on-surface-variant hover:text-on-surface transition-colors"
          data-path="browse-opportunities"
          href="listing.html"
        >
          <span class="material-symbols-outlined text-[24px]"
            >travel_explore</span
          >
          <span class="font-label-sm text-label-sm tracking-tight">Browse</span>
        </a>
        <a
          aria-current="page"
          class="flex flex-col items-center justify-center gap-space-3xs min-w-[60px] h-12 transition-colors text-primary font-bold"
          data-path="saved-opportunities"
          href="saved.html"
        >
          <span class="material-symbols-outlined text-[24px]">bookmark</span>
          <span class="font-label-sm text-label-sm tracking-tight">Saved</span>
        </a>
        <a
          class="flex flex-col items-center justify-center gap-space-3xs min-w-[60px] h-12 text-on-surface-variant hover:text-on-surface transition-colors"
          data-path="profile"
          href="profile.html"
        >
          <span class="material-symbols-outlined text-[24px]"
            >account_circle</span
          >
          <span class="font-label-sm text-label-sm tracking-tight"
            >Profile</span
          >
        </a>
      </div>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/card.js"></script>
    <script src="js/saved.js"></script>
  </body>
</html>
